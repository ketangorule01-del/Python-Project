<!DOCTYPE html>
<html>
<head>
	<title>Grid System</title>
	<link rel="stylesheet" type="text/css" href="bootstrap.min.css">
</head>
<body>
	<br>
<div class="container">
	<div class="row">
		<div class="col-sm-12">
			<label>Address</label>
			<input type="text" placeholder="Enter Address" class="form-control" name="">
		</div>
	</div>
	<br>
	<div class="row">
		<div class="col-6">
			<label>Name</label>
			<input type="text" placeholder="Enter Name" class="form-control" name="">
		</div>
		<div class="col-6">
			<label>Email</label>
			<input type="email" placeholder="Enter Email" class="form-control" name="">
		</div>
	</div>
	<br>
	<div class="row">
		<div class="col-4">
			<label>Contact</label>
			<input type="tel" placeholder="Enter Contact" class="form-control" name="">
		</div>
		<div class="col-4">
			<label>Password</label>
			<input type="password" placeholder="Enter Password" class="form-control" name="">
		</div>
		<div class="col-4">
			<label>Confirm Password</label>
			<input type="password" placeholder="Enter Confirm Password" class="form-control" name="">
		</div>
	</div>
	<br>
	<div class="row">
		<div class="col-3">
			<label>Age</label>
			<input type="text" placeholder="Enter Age" class="form-control" name="">
		</div>
		<div class="col-3">
			<label>Age</label>
			<input type="text" placeholder="Enter Age" class="form-control" name="">
		</div>
		<div class="col-3">
			<label>Age</label>
			<input type="text" placeholder="Enter Age" class="form-control" name="">
		</div>
		<div class="col-3">
			<label>Age</label>
			<input type="text" placeholder="Enter Age" class="form-control" name="">
		</div>

	</div>
	<br>
	<div class="row">
		<div class="col-5">
			<label>Image</label>
			<input type="file" class="form-control" name="">
		</div>
		<div class="col-5">
			<label>Image</label>
			<input type="file" class="form-control" name="">
		</div>
		<div class="col-2">
			<label>Image</label>
			<input type="file" class="form-control" name="">
		</div>

	</div>
	<br>
	<div class="row">
		<div class="col-sm-3"></div>
		<div class="col-sm-3">
			Male
		</div>
		<div class="col-sm-3">
			Female
		</div>
		<div class="col-sm-3"></div>
	</div>
	<br>
<h1>Login Form</h1>
<div class="row">
	<div class="col-sm-6">
		Image
	</div>
	<div class="col-sm-6">
		<h2>Login</h2>
		<div class="row">
			<div class="col-sm-12">
				Username
			</div>
		</div>
		<br>
		<div class="row">
			<div class="col-sm-12">
				Password
			</div>
		</div>
		<br>
		<div class="row">
			<div class="col-sm-12">
				Button
			</div>
		</div>
		<br>
		<div class="row">
			<div class="col-sm-12">
				Forget Password
			</div>
		</div>
		<div class="row">
			<div class="col-sm-12">
				Create a new Account
			</div>
		</div>
	</div>
</div>





</div>
</body>
</html>
