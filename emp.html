<!DOCTYPE html>
<html>
<head>
	<title>Emp Details</title>
	<link rel="stylesheet" type="text/css" href="student.css">
</head>
<body>
<form action="" method="" autocomplete="" target="" enctype="" novalidate="">
	<h1>Emp Details</h1>
	<br>
	<label>Emp Id</label>
	<input type="text" required="" value="EMP101" readonly="" name="" placeholder="Enter Emp Id">
	<br><br>
	<label>Name</label>
	<input type="text" name="" placeholder="Enter Name" required="" pattern="[A-Za-z]" title="Enter Only String Value">
	<br><br>
	<label>Address</label>
	<textarea name="" placeholder="Enter Address" cols="" rows="" required=""></textarea>
	<br><br>
	<label>Contact No</label>
	<input type="tel" maxlength="10" minlength="10" required="" pattern="[0-9]" title="Enter only number" name="" placeholder="Enter Number">
	<br><br>
	<label>Dept</label>
	<select name="">
		<optgroup label="Programming">
			<option>Java</option>
			<option>Python</option>
		</optgroup>
		<optgroup label="Database">
			<option>Mysql</option>
			<option>Sql</option>
		</optgroup>
		
	</select>
	<br><br>
	<label>Email id</label>
	<input type="email" placeholder="Enter Email"  name="" required="">
	<br><br>
	<label>Salary</label>
	<input type="number" placeholder="Enter Salary" name="" >
	<br><br>
	<label>Education</label>
	<select>
		<option>Select Edu</option>
		<option>BSC</option>
		<option>BCS</option>
	</select>
	<br><br>
	<label>Gender</label>
	<input step="" type="radio" name="gender">Male
	<input type="radio" name="gender">Female
	<br><br>
	<label>Image</label>
	<input type="file" accept=".jpg,.png" name="" required="">
	<br><br>
	<label>Date of Join</label>
	<input type="date" name="" required="">
	<br><br>
	<input type="submit" value="Add" name="">
	<input type="reset" value="Clear" name="">

</form>
</body>
</html>
