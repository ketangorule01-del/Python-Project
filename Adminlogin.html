<!DOCTYPE html>
<html>
<head>
	<title>Login</title>
	<link rel="stylesheet" type="text/css" href="bootstrap.min.css">
	<style type="text/css">
		.A
		{
			background-image: url(9.jpg);
			background-size: cover;
		}
		input[type=text],[type=password]
		{
			background-color: lightgrey;
		}

	</style>
</head>
<body class="bg-danger">
<div class="container bg-light mt-5 ">
	<div class="row">
		<div class="col-sm-6 A p-4">
			
		</div>
		<div class="col-sm-6 B p-4" style="box-shadow: 5px 5px blue">
			<h2 >Login
				</h2>
				<hr style="color:darkred;width: 80px;border:solid 3px red;">
			<div class="row">
				<div class="col-sm-12">
					<label>Username <span>*</span></label>
					<input type="text" placeholder="Enter Your Username" class="form-control" name="">
				</div>
			</div>
			<br>
			<div class="row">
				<div class="col-sm-12">
					<label>Password <span>*</span></label>
					<input type="password" class="form-control" placeholder="Enter your Password" name="">
				</div>
			</div>
			<br>
			<div class="row">
				<div class="col-sm-12">
					<input type="checkbox"  name=""> Remember Me
				</div>
			</div>
			<br>
			<div class="row">
				<div class="col-sm-12">
					<input type="submit"  name="" value="LOGIN" class="form-control btn btn-danger"> 
				</div>
			</div>
			<br>
			<div class="row">
				<div class="col-sm-12">
					<a style="color: grey">Forget Password?</a>
				</div>
			</div>
			<br>
			<div class="row">
				<div class="col-sm-12">
					<a style="color: grey">Dont Have An Account?</a>
				</div>
			</div>
		</div>
	</div>
</div>
</body>
</html>
