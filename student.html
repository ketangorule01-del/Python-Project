<!DOCTYPE html>
<html>
<head>
	<title>Student Details</title>
	<link rel="stylesheet" type="text/css" href="student.css">

</head>
<body>
<form action="" method="">
	<div>
	<h2 id="title">Student Details</h2>
</div>
	<h1 class="stud">Hello</h1>
	<br>
	<label  >Prn No/Student Id</label>
	<input type="tel" maxlength="10" minlength="10" placeholder="Enter PRN" name="" required="" value="1234667895" readonly="" disabled="">
	<br><br>
	<label>Name</label>
	<input type="text" placeholder="Enter Name" name="" title="Enter only String values"  pattern="[A-Za-z]" required="">
	<br><br>
	<label>Address</label>
	<textarea name="" placeholder="Enter Address" cols="" rows=""></textarea>
	<br><br>
	<label>Contact No</label>
	<input type="tel" maxlength="10" minlength="10" pattern="[0-9]" placeholder="Enter Number" name="" required="" title="Enter Only Number">
	<br><br>
	<label>Email Id</label>
	<input type="email" placeholder="Enter Email" name="">
	<br><br>
	<label>Profile Image</label>
	<input type="file" accept=".jpg,.png" name="">
	<br><br>
	<label>Dept</label>
	<select>
		<option>Select Dept</option>
		<option>BSC</option>
		<option>BCA</option>
		<option>BCS</option>
	</select>
	<br><br>
	<label>DOB</label>
	<input type="date" name="">
	<br><br>
	<label>Gender</label>
	<input type="radio" name="gender">Male
	<input type="radio" name="gender">Female
	<br><br>
	<label>Age</label>
	<input type="number" placeholder="Enter Age" min="15" max="100" name="">
	<br><br>
	<input type="submit" value="Submit" name="">
	<input type="reset" value="Clear" name="">
</form>
</body>
</html>
