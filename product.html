<!DOCTYPE html>
<html>
<head>
	<title>Product Details</title>
    <link rel="stylesheet" type="text/css" href="product.css">
</head>
<body>
	<form action="" method="">
		<h1>Product Details</h1>
		
		<br>
		<label>Product Id</label>
		<input type="number" min="1" max="100" placeholder="Enter Product Id" name="">
		<br><br>
		<label>Product Name</label>
		<input type="text" placeholder="Enter Name"  name="" required=""  title="Enter Only String Values">
		<br><br>
		<label>Price</label>
		<input type="number" min="1" max="10000" name="" required="" placeholder="Enter Price">
		<br><br>
		<label>Qty</label>
		<input type="number" placeholder="Enter Qty" name="">
		<br><br>
		<label>Product Image</label>
		<input type="file" accept="" name="" required="">
		<br><br>
		<label>Color</label>
		<input type="color" name="">
		<br><br>
		<label>Category</label>
		<input type="text" pattern="[A-Za-z]" placeholder="Enter Category" required="" name="">
		<br><br>
		<label>Sub Category</label>
		<input type="text" placeholder="Enter Sub Category" pattern="[A-Za-z]" name="" required="">
		<br><br>
		<label>Design</label>
		<input type="file" accept="" name="">
		<br><br>
		<label>Size</label>
		<input type="text" pattern="[A-Za-z0-9]" placeholder="Enter Size" name="">
		<br><br>
		<label>Brand</label>
		<select name="">
			<option>Select Brand</option>
			<option>Zara</option>
		</select>
		<br><br>
		<label>Offer</label>
		<input type="text" placeholder="Enter Offer" name="">
		<br><br>
		<label>Feedback</label>
		<input type="text" placeholder="Enter Feedback" name="">
		<br><br>
		<label>Hello BSC</label>
		<input type="submit" value="Save" name="">
		<input type="reset" value="Cancel" name="">

	</form>

</body>
</html>
