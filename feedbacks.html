<!DOCTYPE html>
<html>
<head>
	<title>Feedback</title>
	<link rel="stylesheet" type="text/css" href="bootstrap.min.css">
	<style type="text/css">
		input[type=text],[type=tel],[type=email],textarea
		{
			border:solid 1px blue;
		}
	</style>
</head>
<body style="background-color:   #ffff99">

<div class="row">
	<div class="col-sm-3"></div>
	<div class="col-sm-6">
		<div class="container p-4 mt-5 bg-light rounded-3 border border-primary " style="box-shadow: 5px 5px blue">

	<h2 class="text-center" style="text-transform: uppercase;">Feedback Form</h2>
	<br>
	<div class="row">
		<div class="col-sm-12">
			<input type="text" placeholder="First Name" class="form-control" name="">
		</div>
	</div>
	<br>
	<div class="row">
		<div class="col-sm-12">
			<input type="text" placeholder="Last Name" class="form-control" name="">
		</div>
	</div>
	<br>
	<div class="row">
		<div class="col-sm-12">
			<input type="tel" placeholder="Phone Number" class="form-control" name="">
		</div>
	</div>
	<br>
	<div class="row">
		<div class="col-sm-12">
			<input type="email" placeholder="Email" class="form-control" name="">
		</div>
	</div>
	<br>
	<div class="row">
		<div class="col-sm-12">
			<textarea style="border:solid 1px blue;" name="" placeholder="Your Feedback" class="form-control"></textarea>
		</div>
	</div>
	<br>
	<div class="row">
		<div class="col-sm-12">
			<input type="submit" value="SUBMIT" class="form-control btn btn-info" name="">
		</div>
	</div>
</div>
	</div>
	<div class="col-sm-3"></div>
</div>



</body>
</html>
